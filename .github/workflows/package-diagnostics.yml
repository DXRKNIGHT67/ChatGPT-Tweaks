name: Diagnose Windows packaging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/windows-build.cjs', '.github/workflows/package-diagnostics.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build with sanitized diagnostics
        id: build
        continue-on-error: true
        run: node scripts/windows-build.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish diagnostics
        shell: pwsh
        run: |
          git switch -C agent-tweaks-build-diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-diagnostics.json
          git commit -m 'Record sanitized Windows packaging diagnostics'
          git push origin HEAD:refs/heads/agent-tweaks-build-diagnostics
      - name: Preserve build result
        if: steps.build.outcome == 'failure'
        run: exit 1

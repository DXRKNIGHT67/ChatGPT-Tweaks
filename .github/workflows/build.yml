name: Validate and publish Agent Tweaks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['downloads/**', 'dashboard-preview.png']
permissions:
  contents: write
concurrency:
  group: agent-tweaks-windows
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Engine and profile regression tests
        run: npm test
      - name: Real Windows scan, registry roundtrip and power plan tests
        run: node --test --test-reporter=junit --test-reporter-destination=validation-windows.xml tests/windows.integration.cjs
      - name: Desktop interface tests
        run: |
          npx playwright install chromium
          npm run test:ui
      - name: Actual Electron desktop startup and protected IPC
        run: node tests/electron.integration.cjs
      - name: Build Windows installer and portable app
        run: node scripts/windows-build.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Packaged desktop and installer install-launch-uninstall acceptance
        run: node tests/packaged.integration.cjs
      - name: Record actual executable signatures
        shell: pwsh
        run: |
          $signatures = @(Get-ChildItem dist/*.exe | ForEach-Object { $signature = Get-AuthenticodeSignature $_.FullName; @{ file=$_.Name; status=[string]$signature.Status } })
          ConvertTo-Json -InputObject $signatures | Set-Content signature-report.json
      - name: Verify distribution
        run: node scripts/verify-build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Tweaks-Windows-validated
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            validation-windows.xml
            validation-report.json
            packaged-acceptance.json
      - name: Publish a validated GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $existingTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingTags -contains $tag) {
            Write-Host 'This version is already released. Bump package.json version to publish another release.'
            exit 0
          }
          @(
            "Agent Tweaks $version — Your path for glory."
            'Windows registry/scanner tests, native and packaged startup, installer install/launch/uninstall, and checksum verification passed.'
            'See validation-report.json for the exact source commit, acceptance results and actual signing status.'
            'Game FPS and ping gains have not been benchmarked on your PC and are not guaranteed. Windows reputation warnings can remain for new or unsigned releases.'
          ) | Set-Content release-notes.md
          $assets = @(Get-ChildItem dist/*.exe | ForEach-Object { $_.FullName })
          $assets += @('dist/SHA256SUMS.txt', 'validation-report.json', 'validation-windows.xml', 'packaged-acceptance.json')
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Agent Tweaks $version — Your path for glory" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
